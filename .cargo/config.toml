[build]
incremental = true

[env]
MACOSX_DEPLOYMENT_TARGET = { value = "11.0", force = false }

[target.x86_64-apple-darwin]
rustflags = ["-C", "link-arg=-fuse-ld=lld"]

[target.aarch64-apple-darwin]
rustflags = ["-C", "link-arg=-mmacosx-version-min=11.0"]

[alias]
ck = "check"
t = "test"
r = "run"
rr = "run --release"
b = "build"
br = "build --release"
